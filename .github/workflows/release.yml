name: Release

# Releases are automated on every push to `main` with the shared Open20 release
# actions (https://github.com/open20-rpg/open20-release):
#   1. `release` reads the Conventional Commits since the last tag and, if any
#      is visible to users, publishes a version: it writes it into manifest.json
#      and the popup (scripts/bump_version.mjs), commits them as
#      `chore(release): vX.Y.Z [skip ci]`, tags `vX.Y.Z` and creates the GitHub
#      Release with the notes. Pushes with nothing releasable stop there.
#   2. `announce` posts the version on Discord, saying it's on its way to the
#      stores.
#   3. The zip is built from that tag and attached to the release (the
#      announcement gets github_ready) and uploaded to the Chrome Web Store and
#      Firefox Add-ons.
#   4. When each store publishes it (it can take days), an external watcher
#      starts store-status.yml, which reacts with the store's emoji and, once
#      both did, drops the "on its way" line.
#
# To redo step 3 for an existing release (e.g. after a failed store
# upload), run this workflow by hand with its tag.
#
# Discord uses the organization's DISCORD_BOT_TOKEN secret; without it nothing
# is announced and the release goes on.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish an existing release instead of releasing (tag, e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

# Never run two releases at once (they'd race for the same version).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: open20-rpg/open20-release/release@v1
        id: release
        with:
          prepare: node scripts/bump_version.mjs ${nextRelease.version}
          commit-assets: |
            manifest.json
            popup/popup.html

  announce:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      # For the banner's background and icon.
      - uses: actions/checkout@v4

      - uses: open20-rpg/open20-release/discord-announce@v1
        with:
          tag: ${{ needs.release.outputs.tag }}
          title: Nivel21
          download: https://open20.app/nivel21
          status: "⏳ En camino a las tiendas: Chrome y Firefox suman su ✅ cuando la publican, lo que puede tardar unas horas. Mientras tanto se puede instalar a mano desde la release."
          banner-background: .github/discord-banner.jpg
          banner-icon: icons/icon128.png
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}

  build:
    needs: [release, announce]
    if: ${{ !cancelled() && (needs.release.outputs.tag != '' || inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || needs.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build zip file
        run: ./prepare_zip.sh

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: n21ext-zip
          path: n21ext.zip

      - name: Attach zip to GitHub release
        run: gh release upload "$RELEASE_TAG" n21ext.zip --repo "${{ github.repository }}" --clobber
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: open20-rpg/open20-release/discord-react@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          emoji: github_ready
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}

  release-chrome-extension:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}

    steps:
      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          name: n21ext-zip
          path: .

      - name: Release chrome extension
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: n21ext.zip
          extension-id: jadlpdmjlfghndcehdhjhgndfmigbdoe
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}

  release-firefox-addon:
    runs-on: ubuntu-latest
    needs: [release, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || needs.release.outputs.tag }}

    steps:
      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          name: n21ext-zip
          path: .

      - name: Release firefox add-on
        uses: androettop/release-firefox-addon@v1.0.2
        with:
          addon-id: "nivel21"
          addon-path: n21ext.zip
          auth-api-issuer: ${{ secrets.AUTH_API_ISSUER }}
          auth-api-secret: ${{ secrets.AUTH_API_SECRET }}
          compatibility-android: true
          compatibility-android-min: "120.0"
          release-note: "Release ${{ env.RELEASE_TAG }}"

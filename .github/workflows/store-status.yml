name: Store status

# The stores publish a version only after their review, which can take days.
# When one does, an external watcher starts this run (GitHub drops most
# scheduled runs, so it isn't a cron here): it reacts to the version's Discord
# announcement with the emoji of each store already serving it and, once both
# are, drops the announcement's "on its way" line. It takes a few seconds and
# can also be run by hand.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the stores
        id: stores
        run: |
          status=$(node scripts/store_status.mjs "$TAG")
          echo "chrome=$(jq -r .chrome <<< "$status")" >> "$GITHUB_OUTPUT"
          echo "firefox=$(jq -r .firefox <<< "$status")" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}

      - uses: open20-rpg/open20-release/discord-react@v1
        if: steps.stores.outputs.chrome == 'true'
        with:
          tag: ${{ inputs.tag }}
          emoji: chrome_ready
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}

      - uses: open20-rpg/open20-release/discord-react@v1
        if: steps.stores.outputs.firefox == 'true'
        with:
          tag: ${{ inputs.tag }}
          emoji: firefox_ready
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}

      - uses: open20-rpg/open20-release/discord-finish@v1
        if: steps.stores.outputs.chrome == 'true' && steps.stores.outputs.firefox == 'true'
        with:
          tag: ${{ inputs.tag }}
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}
